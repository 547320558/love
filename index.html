<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>冰晶双爱心 · 呼吸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020012;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }
    #info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(200, 220, 255, 0.35);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      pointer-events: none;
    }
  </style>

  <!-- 引入 Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    
    // --- 初始化场景 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020012);
    scene.fog = new THREE.FogExp2(0x020012, 0.00001);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 1.5, 11);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x020012);
    document.body.appendChild(renderer.domElement);

    // --- 光源 ---
    const ambientLight = new THREE.AmbientLight(0x334466);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x99ccff, 0.5);
    dirLight.position.set(1, 1, 1);
    scene.add(dirLight);

    // --- 相机控制（可拖动视角）---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.6;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.5;
    controls.target.set(0, 0, 0);
    controls.update();

    // --- 背景星尘 ---
    function createStarField() {
      const starsGeometry = new THREE.BufferGeometry();
      const starsCount = 400;
      const positions = new Float32Array(starsCount * 3);
      for (let i = 0; i < starsCount * 3; i += 3) {
        const radius = 12 + Math.random() * 20;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.asin((Math.random() * 2) - 1);
        positions[i] = Math.cos(theta) * Math.cos(phi) * radius;
        positions[i + 1] = Math.sin(phi) * radius * 0.6;
        positions[i + 2] = Math.sin(theta) * Math.cos(phi) * radius;
      }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const starsMaterial = new THREE.PointsMaterial({
        size: 0.1,
        color: 0xaaccff,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.6,
        transparent: true
      });
      return new THREE.Points(starsGeometry, starsMaterial);
    }
    const starField = createStarField();
    scene.add(starField);

    // --- 核心：呼吸爱心生成函数 ---
    function createBreathingHeart(colorHex, positionOffset) {
      const particleCount = 2000;
      
      // 存储每个粒子的“基础位置”（未呼吸时）
      const basePositions = new Float32Array(particleCount * 3);
      // 存储每个粒子的随机偏移方向（用于呼吸时沿径向外扩）
      const offsets = new Float32Array(particleCount * 3);
      
      const scale = 0.12;
      const color = new THREE.Color(colorHex);

      // 心形数学公式
      function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
      function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

      for (let i = 0; i < particleCount; i++) {
        // 随机角度
        const t = Math.random() * Math.PI * 2;
        // 内部填充因子：0.1 到 1.0，偏向边缘（让形状更实）
        const innerFactor = Math.random() < 0.35 ? Math.random() * 0.4 : 0.4 + Math.random() * 0.6;
        
        let hx = heartX(t);
        let hy = heartY(t);
        
        // 内部填充
        hx *= innerFactor;
        hy *= innerFactor;
        
        // Z轴厚度
        const zDepth = (Math.random() - 0.5) * 1.5;
        
        // 存入基础位置
        basePositions[i * 3] = hx * scale + positionOffset.x;
        basePositions[i * 3 + 1] = hy * scale + positionOffset.y;
        basePositions[i * 3 + 2] = zDepth * scale * 15 + positionOffset.z;
        
        // 每个粒子的随机外扩方向（归一化）
        const dx = hx * scale;
        const dy = hy * scale;
        const len = Math.sqrt(dx * dx + dy * dy) + 0.001;
        offsets[i * 3] = dx / len;
        offsets[i * 3 + 1] = dy / len;
        offsets[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(basePositions, 3));
      
      // 自定义 ShaderMaterial 实现呼吸效果
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: color },
          uOffsets: { value: offsets },
          uBreathAmp: { value: 0 } // 呼吸幅度：0 到 1
        },
        vertexShader: `
          uniform float uTime;
          uniform float uBreathAmp;
          attribute vec3 offset; // 每个粒子的外扩方向
          
          varying float vAlpha;
          
          void main() {
            // 呼吸：沿 offset 方向外扩
            float breath = uBreathAmp * 1.8; // 最大外扩距离
            vec3 pos = position + offset * breath;
            
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            
            gl_PointSize = 220.0 / -mvPosition.z; // 粒子大小随距离衰减
            vAlpha = 0.9;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          varying float vAlpha;
          
          void main() {
            // 圆形粒子
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            
            // 发光效果
            float alpha = (1.0 - dist * 2.0) * 0.85;
            alpha = pow(alpha, 1.5);
            
            // 中心更亮
            float core = 1.0 - dist * 1.5;
            core = pow(core, 3.0) * 0.6;
            alpha += core;
            
            gl_FragColor = vec4(uColor * 1.3, alpha * vAlpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geometry, material);
      
      // 把 offsets 作为 attribute 传入 shader
      geometry.setAttribute('offset', new THREE.BufferAttribute(offsets, 3));
      
      return points;
    }

    // --- 创建两个爱心 ---
    const heart1 = createBreathingHeart('#5599ff', new THREE.Vector3(-2.2, 0.2, 0));
    const heart2 = createBreathingHeart('#ff9966', new THREE.Vector3(2.2, -0.2, 0));
    
    scene.add(heart1);
    scene.add(heart2);

    // --- 光环（可选装饰）---
    function createRing(radius, colorHex, posOffset) {
      const ringCount = 250;
      const ringGeo = new THREE.BufferGeometry();
      const ringPositions = new Float32Array(ringCount * 3);
      for (let i = 0; i < ringCount; i++) {
        const angle = (i / ringCount) * Math.PI * 2;
        ringPositions[i * 3] = Math.cos(angle) * radius + posOffset.x;
        ringPositions[i * 3 + 1] = Math.sin(angle * 3) * 0.3 + posOffset.y;
        ringPositions[i * 3 + 2] = Math.sin(angle) * radius + posOffset.z;
      }
      ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
      const ringMat = new THREE.PointsMaterial({
        size: 0.06,
        color: colorHex,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.5,
        transparent: true
      });
      return new THREE.Points(ringGeo, ringMat);
    }
    
    const ring1 = createRing(2.3, '#5599ff', new THREE.Vector3(-2.2, 0.2, 0));
    const ring2 = createRing(2.3, '#ff9966', new THREE.Vector3(2.2, -0.2, 0));
    scene.add(ring1);
    scene.add(ring2);

    // --- 动画循环 ---
    let clock = new THREE.Clock();

    function animate() {
      const elapsedTime = performance.now() * 0.001;
      
      controls.update();
      
      // 呼吸节奏：用正弦波模拟
      const breathCycle = Math.sin(elapsedTime * 2.5); // -1 到 1
      const breathAmp = (breathCycle + 1) / 2;        // 0 到 1
      
      // 两个爱心错开呼吸：一个扩张时另一个收缩
      const breathAmp1 = (Math.sin(elapsedTime * 2.5) + 1) / 2;
      const breathAmp2 = (Math.sin(elapsedTime * 2.5 + Math.PI) + 1) / 2;
      
      // 更新 shader 的呼吸幅度
      heart1.material.uniforms.uBreathAmp.value = breathAmp1;
      heart2.material.uniforms.uBreathAmp.value = breathAmp2;
      
      // 光环旋转
      ring1.rotation.y += 0.004;
      ring2.rotation.y -= 0.004;
      
      // 星尘微动
      starField.rotation.y += 0.00015;
      
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // --- 窗口自适应 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 移动端确保动画运行
    document.body.addEventListener('touchstart', () => {
      controls.autoRotate = true;
    }, { passive: true });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>冰晶3D双爱心 | Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020012;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }
    #info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(200, 220, 255, 0.4);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">DRAG TO ROTATE VIEW</div>

  <!-- 引入 Three.js 核心库以及扩展 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    
    // --- 初始化场景、相机、渲染器 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020012);
    
    // 添加一点雾效，增加景深感
    scene.fog = new THREE.FogExp2(0x020012, 0.000015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 2, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制过高像素比以防手机发烫
    renderer.setClearColor(0x020012);
    document.body.appendChild(renderer.domElement);

    // --- 后期处理：辉光效果（UnrealBloomPass）让粒子更冰晶剔透 ---
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.1;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 轨道控制器（允许用户拖动视角，体验3D感）---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.5;
    controls.target.set(0, 0, 0);
    controls.update();

    // --- 光源设置（让粒子颜色更亮丽）---
    const ambientLight = new THREE.AmbientLight(0x404066);
    scene.add(ambientLight);
    
    const dirLight1 = new THREE.DirectionalLight(0x99ccff, 0.6);
    dirLight1.position.set(1, 1, 1);
    scene.add(dirLight1);
    
    const dirLight2 = new THREE.DirectionalLight(0xff88aa, 0.4);
    dirLight2.position.set(-1, -0.5, -1);
    scene.add(dirLight2);
    
    // 添加一些点光源在爱心周围
    const pointLight = new THREE.PointLight(0x4488ff, 0.8, 15);
    pointLight.position.set(2, 1, 2);
    scene.add(pointLight);

    // --- 背景星尘粒子（增强空间感）---
    function createStarField() {
      const starsGeometry = new THREE.BufferGeometry();
      const starsCount = 600;
      const starsPositions = new Float32Array(starsCount * 3);
      const starsColors = new Float32Array(starsCount * 3);
      
      for (let i = 0; i < starsCount * 3; i += 3) {
        // 分布在较大的球形区域
        const radius = 15 + Math.random() * 25;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.asin((Math.random() * 2) - 1);
        
        starsPositions[i] = Math.cos(theta) * Math.cos(phi) * radius;
        starsPositions[i+1] = Math.sin(phi) * radius * 0.6;
        starsPositions[i+2] = Math.sin(theta) * Math.cos(phi) * radius;
        
        // 随机淡蓝或淡紫色
        const colorChoice = Math.random();
        let r, g, b;
        if (colorChoice < 0.6) {
          r = 0.7 + Math.random() * 0.3;
          g = 0.8 + Math.random() * 0.2;
          b = 1.0;
        } else if (colorChoice < 0.85) {
          r = 0.9 + Math.random() * 0.1;
          g = 0.7 + Math.random() * 0.3;
          b = 0.9 + Math.random() * 0.1;
        } else {
          r = 1.0;
          g = 0.8 + Math.random() * 0.2;
          b = 0.7 + Math.random() * 0.3;
        }
        
        starsColors[i] = r;
        starsColors[i+1] = g;
        starsColors[i+2] = b;
      }
      
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
      starsGeometry.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));
      
      const starsMaterial = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.7,
        transparent: true
      });
      
      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);
      return stars;
    }
    
    const starField = createStarField();

    // --- 核心：生成实心爱心粒子系统 ---
    function heartFunction(t) {
      // 心形参数方程
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      return { x, y };
    }

    function createHeartParticles(colorInner, colorOuter, positionOffset) {
      const particleCount = 1800; // 粒子数量足够让爱心饱满
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      // 爱心缩放因子
      const scale = 0.135;
      
      const innerColor = new THREE.Color(colorInner);
      const outerColor = new THREE.Color(colorOuter);

      for (let i = 0; i < particleCount; i++) {
        // 使用数学模型确保粒子填满内部
        const t = Math.random() * Math.PI * 2;
        const heartPoint = heartFunction(t);
        
        // 随机内部因子：0到1之间，用于填充内部
        const innerFactor = Math.pow(Math.random(), 0.7); // 偏向边缘分布，保证形状清晰
        
        let px = heartPoint.x * innerFactor * scale;
        let py = heartPoint.y * innerFactor * scale;
        
        // 添加Z轴厚度，制造立体感
        const zDepth = (Math.random() - 0.5) * 1.8 * scale * 17;
        
        // 应用位置偏移（用于两个爱心错开）
        positions[i * 3] = px + positionOffset.x;
        positions[i * 3 + 1] = py + positionOffset.y;
        positions[i * 3 + 2] = zDepth + positionOffset.z;
        
        // 颜色根据位置在内部颜色和外部颜色之间插值
        const distFromCenter = Math.sqrt(px*px + py*py) / scale;
        const mixFactor = Math.min(1, distFromCenter / 12);
        
        const particleColor = innerColor.clone().lerp(outerColor, mixFactor);
        
        colors[i * 3] = particleColor.r;
        colors[i * 3 + 1] = particleColor.g;
        colors[i * 3 + 2] = particleColor.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // 创建圆形粒子纹理
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const context = canvas.getContext('2d');
      context.beginPath();
      context.arc(8, 8, 6, 0, 2 * Math.PI);
      const gradient = context.createRadialGradient(8, 8, 0, 8, 8, 6);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.5, 'rgba(200,230,255,0.9)');
      gradient.addColorStop(1, 'rgba(100,150,255,0)');
      context.fillStyle = gradient;
      context.fill();
      
      const texture = new THREE.CanvasTexture(canvas);
      
      const material = new THREE.PointsMaterial({
        size: 0.22,
        map: texture,
        blending: THREE.AdditiveBlending,
        depthWrite: true,
        depthTest: true,
        vertexColors: true,
        opacity: 0.9,
        transparent: true,
      });

      const heartParticles = new THREE.Points(geometry, material);
      return heartParticles;
    }

    // --- 创建两个爱心：蓝冰晶（左）和暖金冰晶（右）---
    const heart1 = createHeartParticles('#4488ff', '#aaccff', new THREE.Vector3(-2.2, 0.3, 0));
    const heart2 = createHeartParticles('#ff8844', '#ffccaa', new THREE.Vector3(2.2, -0.3, 0));
    
    scene.add(heart1);
    scene.add(heart2);

    // --- 外侧旋转光环（增加动态感）---
    function createOrbitRing(radius, color, positionOffset) {
      const ringParticleCount = 300;
      const ringPositions = new Float32Array(ringParticleCount * 3);
      
      for (let i = 0; i < ringParticleCount; i++) {
        const angle = (i / ringParticleCount) * Math.PI * 2;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = Math.sin(angle * 3) * 0.4;
        
        ringPositions[i * 3] = x + positionOffset.x;
        ringPositions[i * 3 + 1] = y + positionOffset.y;
        ringPositions[i * 3 + 2] = z + positionOffset.z;
      }
      
      const ringGeometry = new THREE.BufferGeometry();
      ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
      
      const ringMaterial = new THREE.PointsMaterial({
        size: 0.08,
        color: color,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.5,
        transparent: true
      });
      
      const ring = new THREE.Points(ringGeometry, ringMaterial);
      return ring;
    }
    
    const ring1 = createOrbitRing(2.4, '#4488ff', new THREE.Vector3(-2.2, 0.3, 0));
    const ring2 = createOrbitRing(2.4, '#ff8844', new THREE.Vector3(2.2, -0.3, 0));
    
    scene.add(ring1);
    scene.add(ring2);

    // --- 动画循环 ---
    let clock = new THREE.Clock();

    function animate() {
      const delta = clock.getDelta();
      const elapsedTime = performance.now() * 0.001; // seconds
      
      // 自动旋转控制
      controls.update();
      
      // 让两个爱心自身轻微旋转（模拟呼吸感）
      heart1.rotation.y = Math.sin(elapsedTime * 0.5) * 0.2;
      heart1.rotation.x = Math.sin(elapsedTime * 0.3) * 0.1;
      
      heart2.rotation.y = Math.sin(elapsedTime * 0.5 + Math.PI) * 0.2;
      heart2.rotation.x = Math.sin(elapsedTime * 0.3 + Math.PI) * 0.1;
      
      // 光环旋转
      ring1.rotation.y += 0.005;
      ring2.rotation.y -= 0.005;
      
      // 背景星星缓慢旋转
      starField.rotation.y += 0.0002;
      starField.rotation.x += 0.0001;
      
      // 点光源微动
      pointLight.position.x = Math.sin(elapsedTime * 0.7) * 3;
      pointLight.position.z = Math.cos(elapsedTime * 0.7) * 3;
      
      // 使用composer渲染（带辉光效果）
      composer.render();
      
      requestAnimationFrame(animate);
    }

    animate();

    // --- 窗口大小自适应 ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    // 移动端触摸启动
    document.body.addEventListener('touchstart', () => {
      controls.autoRotate = true;
    }, { passive: true });

  </script>
</body>
</html>

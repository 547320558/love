<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>很高兴遇见你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            font-family: 'Comic Sans MS', '幼圆', 'YouYuan', sans-serif;
            user-select: none;
        }

        .note {
            position: absolute;
            left: 0;
            top: 0;
            width: 46px;
            height: 56px;
            background: #fff9c4;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.18);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #d81b60;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
            padding: 4px;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                rgba(0, 0, 0, 0.04) 8px,
                rgba(0, 0, 0, 0.04) 10px
            );
            transform-origin: center;
            /* 初始隐藏 */
            transform: scale(0);
            opacity: 0;
            transition: none;
            pointer-events: none;
        }

        /* 小图钉装饰 */
        .note::before {
            content: '📌';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            line-height: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 缤纷色彩 */
        .note:nth-child(odd)  { background-color: #ffcdd2; }
        .note:nth-child(3n)   { background-color: #f8bbd0; }
        .note:nth-child(5n+2) { background-color: #e1bee7; }
        .note:nth-child(7n+4) { background-color: #bbdefb; }
        .note:nth-child(9n+6) { background-color: #c8e6c9; }

        /* 特殊爱你呦便利贴样式 */
        .special-note {
            width: 90px !important;
            height: 100px !important;
            font-size: 18px !important;
            background: #ffecb3 !important;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.25) !important;
            z-index: 20 !important;
        }
        .special-note::before {
            font-size: 18px !important;
            top: -14px !important;
        }

        /* 底部提示文字 */
        .hint {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: #ad1457;
            font-size: 18px;
            letter-spacing: 2px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 1.2s;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="hint" id="hint">💗 喜欢你，是便利签都写不完的心事 💗</div>

    <script>
        (function() {
            const container = document.getElementById('container');
            const hint = document.getElementById('hint');
            const noteCount = 72;
            const heartScale = 12;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2 - 20;

            // 爱心参数方程（y轴向下）
            function heartX(t) {
                return 16 * Math.pow(Math.sin(t), 3);
            }
            function heartY(t) {
                return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            }

            const notesData = [];
            const words = ["多喝热水", "好好爱自己", "梦想成真", "早点休息", "要快乐",
         "万事顺遂", "要平安", "保持好心情", "要好运", "天天开心",
         "笑口常开", "平安喜乐", "别熬夜", "要健康", "万事胜意","要暴富"];

            // 创建所有便利签元素
            for (let i = 0; i < noteCount; i++) {
                const t = (i / noteCount) * 2 * Math.PI;
                const tx = heartX(t) * heartScale + centerX;
                const ty = heartY(t) * heartScale + centerY;

                const text = words[Math.floor(Math.random() * words.length)];
                const note = document.createElement('div');
                note.className = 'note';
                note.textContent = text;

                note.style.transform = `translate(${centerX}px, ${centerY}px) scale(0) rotate(0deg)`;
                note.style.opacity = '0';
                container.appendChild(note);

                notesData.push({
                    el: note,
                    targetTx: tx,
                    targetTy: ty,
                    targetRot: (Math.random() - 0.5) * 20,
                    scatterAngle: Math.random() * 2 * Math.PI,
                    scatterDist: 180 + Math.random() * 160,
                    reappearX: 50 + Math.random() * (window.innerWidth - 100),
                    reappearY: 50 + Math.random() * (window.innerHeight - 100),
                    reappearRot: (Math.random() - 0.5) * 10
                });
            }

            function setTransition(el, transitionCSS) {
                el.style.transition = transitionCSS;
            }

            async function runAnimation() {
                const [first, ...others] = notesData;

                // ---- 阶段1：第一张便利签弹出 ----
                setTransition(first.el, 'transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s');
                first.el.style.transform = `translate(${centerX}px, ${centerY}px) scale(1) rotate(0deg)`;
                first.el.style.opacity = '1';
                await wait(800);

                // ---- 阶段2：第一张飞向爱心顶点，同时带出其余便利签 ----
                const peakX = centerX;
                const peakY = centerY - 5 * heartScale;
                setTransition(first.el, 'transform 1s ease, opacity 1s');
                first.el.style.transform = `translate(${peakX}px, ${peakY}px) rotate(${first.targetRot}deg)`;

                const startTime = 200;
                for (let i = 0; i < others.length; i++) {
                    setTimeout(() => {
                        const note = others[i];
                        setTransition(note.el, 'transform 0.65s ease, opacity 0.65s');
                        note.el.style.transform = `translate(${note.targetTx}px, ${note.targetTy}px) rotate(${note.targetRot}deg)`;
                        note.el.style.opacity = '1';
                    }, startTime + i * 22);
                }
                await wait(3200);

                // ---- 阶段3：爱心停留 ----
                await wait(1800);

                // ---- 阶段4：爱心消失（向外飞散并淡出）----
                for (let note of notesData) {
                    const angle = note.scatterAngle;
                    const dist = note.scatterDist;
                    const flyX = note.targetTx + Math.cos(angle) * dist;
                    const flyY = note.targetTy + Math.sin(angle) * dist;
                    setTransition(note.el, 'transform 0.8s ease-in, opacity 0.8s ease-in');
                    note.el.style.transform = `translate(${flyX}px, ${flyY}px) rotate(${note.targetRot + 45}deg)`;
                    note.el.style.opacity = '0';
                }
                await wait(1000);

                // ---- 阶段5：便利签重新一个个散落出现 ----
                for (let note of notesData) {
                    note.el.style.transition = 'none';
                    note.el.style.transform = `translate(${note.reappearX}px, ${note.reappearY}px) scale(0) rotate(${note.reappearRot}deg)`;
                    note.el.style.opacity = '0';
                }
                await wait(50);

                for (let i = 0; i < notesData.length; i++) {
                    setTimeout(() => {
                        const note = notesData[i];
                        setTransition(note.el, 'transform 0.45s cubic-bezier(0.34,1.56,0.64,1), opacity 0.45s');
                        note.el.style.transform = `translate(${note.reappearX}px, ${note.reappearY}px) scale(1) rotate(${note.reappearRot}deg)`;
                        note.el.style.opacity = '1';
                    }, i * 55);
                }

                // ---- 阶段6：「爱你呦」特殊便利贴飞入 ----
                // 等散落的便利签都弹出后，再展示最后的重点
                await wait(notesData.length * 55 + 400);

                // 创建特殊便利贴
                const special = document.createElement('div');
                special.className = 'note special-note';
                special.textContent = '爱你呦';
                // 初始位置：屏幕下方外部
                const specialStartX = centerX;
                const specialStartY = window.innerHeight + 100;
                special.style.transition = 'none';
                special.style.transform = `translate(${specialStartX}px, ${specialStartY}px) scale(0) rotate(0deg)`;
                special.style.opacity = '0';
                container.appendChild(special);

                // 强制重绘后播放飞入动画
                await wait(30);
                setTransition(special, 'transform 0.8s cubic-bezier(0.34,1.56,0.64,1), opacity 0.8s');
                special.style.transform = `translate(${centerX}px, ${centerY + 80}px) scale(1) rotate(-3deg)`;
                special.style.opacity = '1';

                // 飞入完成后稍等，再显示底部文字
                await wait(900);
                hint.style.opacity = '1';
            }

            function wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            setTimeout(runAnimation, 400);

            window.addEventListener('resize', () => {
                location.reload();
            });
        })();
    </script>
</body>
</html>

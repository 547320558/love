<!DOCTYPE html>
<html lang="zh-CN">
<head><头>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>给你看个东西</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #0b0b1a 100%);背景: 径向渐变(椭圆 在 中心, #1a0a2e0%, #0b0b1a100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;字体族: '苹方 SC', 'Hiragino Sans GB', '微软雅黑', 无衬线;
      touch-action: manipulation;触摸操作: 可操控;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .text-container {
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }

    .text-container.visible { opacity: 1; }

    .main-line {
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-shadow: 0 0 30px rgba(255, 200, 220, 0.8);
      animation: softPulse 2.8s ease-in-out infinite;
      font-family: "STKaiti", "KaiTi", "楷体", "PingFang SC", serif;
    }

    .sub-line {
      font-size: 1.4rem;
      font-weight: 300;
      opacity: 0;
      animation: fadeSlideUp 1.6s ease forwards;
      animation-delay: 1.2s;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 12px rgba(255, 180, 200, 0.6);
    }

    .hint-line {
      font-size: 0.95rem;
      margin-top: 2rem;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 3.2s;
      color: rgba(255, 255, 255, 0.5);颜色: rgba(255, 255, 255, 0.5);
      letter-spacing字母间距: 0.1em;字间距: 0.1em;
    }

    @keyframes softPulse {
      0%, 100% { text-shadow: 0 0 30px rgba(255, 180, 200, 0.7); }
      50% { text-shadow: 0 0 60px rgba(255, 160, 180, 0.9), 0 0 100px rgba(200, 120, 160, 0.4); }
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <div class="text-container" id="textContainer">
    <div class="main-line">爱你呦</div>
    <div class="sub-line"></div>
    <div class="hint-line"></div>
  </div>

  <script>
    (function() {(函数() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      const textContainer = document.getElementById('textContainer');

      let width, height;
      const particles = [];
      const PARTICLE_COUNT = 160;  // 平衡性能与视觉效果
      let phase = 'scatter';       // scatter / gathering / heartbeat
      let transitionProgress = 0;
      let heartbeatTime = 0;
      let colorShift = 0;

      // 心形参数方程
      function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
      function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

      class Particle {
        constructor() {
          this.t = Math.random() * Math.PI * 2;  // 记录心形参数t，用于动态效果
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.baseX = this.x;
          this.baseY = this.y;
          // 目标心形位置（基于参数t）
          const scale = Math.min(width, height) * 0.018;
          this.targetX = width / 2 + heartX(this.t) * scale;
          this.targetY = height / 2 - heartY(this.t) * scale * 0.65;
          this.size = Math.random() * 2.2 + 0.8;
          this.alpha = Math.random() * 0.5 + 0.5;
        }

        update(progress, heartbeatScale) {
          const eased = 1 - Math.pow(1 - progress, 3);
          let tx = this.targetX;
          let ty = this.targetY;

          // 汇聚完成后，应用心跳缩放效果（围绕中心点缩放）
          if (phase === 'heartbeat') {
            const cx = width / 2;
            const cy = height / 2;
            // 心跳缩放因子：1.0 为正常大小，1.08 为最大
            const scaleFactor = heartbeatScale || 1.0;
            tx = cx + (this.targetX - cx) * scaleFactor;
            ty = cy + (this.targetY - cy) * scaleFactor;
          }

          this.x = this.baseX + (tx - this.baseX) * eased;
          this.y = this.baseY + (ty - this.baseY) * eased;
        }

        draw(ctx, time, progress) {
          ctx.save();
          
          // 动态颜色：基础粉紫色，随时间流淌
          const hue = 330 + Math.sin(time * 0.002 + this.t * 2) * 15 + colorShift;
          const lightness = 70 + Math.sin(time * 0.003 + this.t) * 10;
          this.color = `hsla(${hue}, 85%, ${lightness}%, ${this.alpha})`;
          
          // 光晕效果（用径向渐变模拟）
          const radius = this.size * (1 + 0.3 * Math.sin(time * 0.01 + this.t));
          const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, radius * 3);
          glow.addColorStop(0, this.color);
          glow.addColorStop(0.5, `hsla(${hue}, 85%, ${lightness}%, ${this.alpha * 0.4})`);
          glow.addColorStop(1, 'transparent');
          
          ctx.fillStyle = glow;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = radius * 2.5;
          ctx.beginPath();
          ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
          ctx.fill();
          
          // 核心亮点
          ctx.shadowBlur = 0;
          ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.8})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, radius * 0.4, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }
      }

      function initParticles() {
        particles.length = 0;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        // 更新目标位置，因为画布大小变了
        const scale = Math.min(width, height) * 0.018;
        particles.forEach(p => {
          p.baseX = Math.random() * width;
          p.baseY = Math.random() * height;
          p.targetX = width / 2 + heartX(p.t) * scale;
          p.targetY = height / 2 - heartY(p.t) * scale * 0.65;
        });
      }

      // 心跳动画函数：模拟心脏一收一缩
      function getHeartbeatScale(time) {
        // 每分钟72次，周期约0.833秒
        const period = 0.833;
        const t = (time % period) / period; // 0到1
        // 使用贝塞尔曲线模拟心跳：快速收缩 -> 快速膨胀 -> 平缓
        if (t < 0.15) return 1.0 + 0.08 * Math.sin(t / 0.15 * Math.PI);    // 快速膨胀
        else if (t < 0.3) return 1.0 - 0.04 * Math.sin((t - 0.15) / 0.15 * Math.PI); // 收缩
        else return 1.0;  // 平缓期
      }

      let lastTime = 0;
      function animate(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const delta = Math.min(timestamp - lastTime, 50); // 防止大帧跳跃
        lastTime = timestamp;
        const time = timestamp / 1000;

        // 清除画布，带一点拖影效果（半透明填充，制造流星感）
        ctx.fillStyle = 'rgba(10, 10, 26, 0.15)';
        ctx.fillRect(0, 0, width, height);
        // 偶尔完全清除避免残影过重
        if (Math.random() < 0.05) ctx.clearRect(0, 0, width, height);

        // 更新汇聚进度
        if (phase === 'gathering') {
          transitionProgress += delta * 0.0012; // 约0.8秒完成汇聚
          if (transitionProgress >= 1) {
            transitionProgress = 1;
            phase = 'heartbeat';
            heartbeatTime = time;
            // 显示文字
            setTimeout(() => textContainer.classList.add('visible'), 200);
          }
        }

        // 处理心跳阶段的色彩流动
        if (phase === 'heartbeat') {
          colorShift = Math.sin(time * 0.5) * 15; // 色彩偏移
        }

        const hbScale = phase === 'heartbeat' ? getHeartbeatScale(time - heartbeatTime) : 1.0;

        // 绘制所有粒子
        particles.forEach(p => {
          if (phase === 'scatter') {
            // 散落状态：轻微飘动
            p.x = p.baseX + Math.sin(time * 2 + p.t) * 1.5;
            p.y = p.baseY + Math.cos(time * 2.3 + p.t) * 1.5;
          } else {
            p.update(transitionProgress, hbScale);
          }
          p.draw(ctx, time, transitionProgress);
        });

        // 额外绘制一些随机星光点缀背景
        if (Math.random() < 0.3) {
          const sx = Math.random() * width;
          const sy = Math.random() * height;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.1})`;
          ctx.beginPath();
          ctx.arc(sx, sy, Math.random() * 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(animate);
      }

      function startGathering() {
        if (phase === 'scatter') {
          phase = 'gathering';
          transitionProgress = 0;
        }
      }

      // 强制启动动画的兜底机制
      function forceStart() {
        if (phase === 'scatter') {
          startGathering();
        }
        // 确保文字最终显示
        setTimeout(() => textContainer.classList.add('visible'), 5000);
      }

      window.addEventListener('load', () => {
        resize();
        initParticles();
        requestAnimationFrame(animate);
        // 3秒后自动开始汇聚
        setTimeout(startGathering, 3000);
        // 再设一个保险：10秒后强制显示
        setTimeout(forceStart, 10000);
      });

      window.addEventListener('resize', resize);
      document.body.addEventListener('click', startGathering);
      // 移动端触摸也触发
      document.body.addEventListener('touchstart', () => {
        startGathering();
        // 有些浏览器需要用户交互才能播放音频/动画，手动触发一次requestAnimationFrame
        requestAnimationFrame(animate);
      }, { passive: true });

    })();
  </script>
</body>
</html>

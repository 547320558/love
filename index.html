<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 便利签爱心动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Comic Sans MS', '幼圆', 'YouYuan', sans-serif;
        }

        /* 便利签样式 */
        .note {
            position: absolute;
            width: 44px;
            height: 54px;
            background: #fff9c4;       /* 淡黄底色 */
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.2);
            border-radius: 2px;
            transform-origin: center;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #d81b60;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            padding: 4px;
            /* 模拟便签纸的纹理 */
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                rgba(0,0,0,0.03) 8px,
                rgba(0,0,0,0.03) 10px
            );
        }

        /* 小图钉装饰 */
        .note::before {
            content: '📌';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            line-height: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 不同颜色变化 */
        .note:nth-child(odd)  { background-color: #ffcdd2; }
        .note:nth-child(3n)   { background-color: #f8bbd0; }
        .note:nth-child(5n+2) { background-color: #e1bee7; }
        .note:nth-child(7n+4) { background-color: #bbdefb; }

        /* 底部提示 */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ad1457;
            font-size: 18px;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1s 1.5s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="hint">💗 喜欢你，是便利签上都写不完的心事 💗</div>

    <script>
        (function() {
            const container = document.getElementById('container');
            const noteCount = 72;          // 便签数量
            const heartScale = 19;         // 爱心大小缩放
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // 爱心参数方程
            function heartX(t) {
                return 16 * Math.pow(Math.sin(t), 3);
            }
            function heartY(t) {
                return - (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            }

            const notes = [];

            // 创建所有便签
            for (let i = 0; i < noteCount; i++) {
                const t = (i / noteCount) * 2 * Math.PI;
                // 计算爱心上的目标位置
                const tx = heartX(t) * heartScale + centerX;
                const ty = heartY(t) * heartScale + centerY;

                // 初始位置：随机散布在画面外或边缘
                const side = Math.floor(Math.random() * 4); // 0:上,1:右,2:下,3:左
                let startX, startY;
                const margin = 120;
                switch(side) {
                    case 0: startX = Math.random() * window.innerWidth; startY = -margin; break;
                    case 1: startX = window.innerWidth + margin; startY = Math.random() * window.innerHeight; break;
                    case 2: startX = Math.random() * window.innerWidth; startY = window.innerHeight + margin; break;
                    case 3: startX = -margin; startY = Math.random() * window.innerHeight; break;
                }

                // 每个便签随机小文字
                const words = ['爱你','抱抱','想你','甜蜜','永远','喜欢','心心','❤️', '💕','💖','宝贝','520','么么哒','幸福'];
                const text = words[Math.floor(Math.random() * words.length)];

                // 创建元素
                const note = document.createElement('div');
                note.className = 'note';
                note.textContent = text;
                // 初始随机轻微旋转
                const startRotate = (Math.random() - 0.5) * 60;
                note.style.transform = `translate(${startX}px, ${startY}px) rotate(${startRotate}deg)`;
                
                container.appendChild(note);
                
                // 存储目标数据
                notes.push({
                    el: note,
                    targetTx: tx,
                    targetTy: ty,
                    // 爱心上的最终旋转角度：让便签沿切线方向微微倾斜（可选）
                    targetRot: (Math.random() - 0.5) * 20
                });
            }

            // 启动飞入动画（有一点延迟让页面先渲染）
            setTimeout(() => {
                notes.forEach((item, index) => {
                    // 不同便签依次飞入，营造先后感
                    setTimeout(() => {
                        item.el.style.transform = 
                            `translate(${item.targetTx}px, ${item.targetTy}px) rotate(${item.targetRot}deg)`;
                    }, index * 18);  // 每个间隔18ms
                });
            }, 200);

            // 窗口大小变化时重新计算位置（简单起见可刷新页面）
            window.addEventListener('resize', () => {
                location.reload();
            });
        })();
    </script>
</body>
</html>

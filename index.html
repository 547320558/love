<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>碎冰蓝爱心 · 底部呼吸</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #010a1a;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.126.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ---------- 场景 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010a1a);
    scene.fog = new THREE.FogExp2(0x010a1a, 0.00001);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 光源
    scene.add(new THREE.AmbientLight(0x334466));
    const dir = new THREE.DirectionalLight(0xaaddff, 0.8);
    dir.position.set(1, 1, 1);
    scene.add(dir);

    // ---------- 爱心数据 ----------
    const particleCount = 2000;
    const scale = 0.11;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const basePos = [];          // {x, y, z} 局部坐标
    const bottomWeights = [];    // 底部权重 0~1

    const heartX = t => 16 * Math.sin(t) ** 3;
    const heartY = t => 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

    const colorCenter = new THREE.Color('#7ec8ff'); // 碎冰蓝中心
    const colorEdge = new THREE.Color('#b3e0ff');   // 边缘更亮

    for (let i = 0; i < particleCount; i++) {
      const t = Math.random() * Math.PI * 2;
      let factor;
      if (Math.random() < 0.35) factor = 0.85 + Math.random() * 0.15;
      else factor = Math.random() * 0.85;

      let hx = heartX(t) * factor;
      let hy = heartY(t) * factor;
      hx += (Math.random() - 0.5) * 0.8;
      hy += (Math.random() - 0.5) * 0.8;
      const z = (Math.random() - 0.5) * 1.6;

      basePos.push({ x: hx * scale, y: hy * scale, z: z * scale * 10 });

      // 底部权重：爱心最低 y ≈ -15*scale，最高 ≈ 15*scale
      const yMin = -15 * scale;
      const yMax = 15 * scale;
      let w = 1 - (hy * scale - yMin) / (yMax - yMin);
      w = Math.max(0, Math.min(1, w));
      bottomWeights.push(Math.pow(w, 3)); // 顶部几乎不动

      positions[i*3] = hx * scale;
      positions[i*3+1] = hy * scale;
      positions[i*3+2] = z * scale * 10;

      const mixColor = colorCenter.clone().lerp(colorEdge, factor);
      colors[i*3] = mixColor.r;
      colors[i*3+1] = mixColor.g;
      colors[i*3+2] = mixColor.b;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // 圆形光点贴图
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.beginPath(); ctx.arc(16, 16, 14, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(16,16,0,16,16,14);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.4, 'rgba(200,235,255,0.9)');
    grad.addColorStop(1, 'rgba(120,180,255,0)');
    ctx.fillStyle = grad; ctx.fill();
    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.PointsMaterial({
      size: 0.28,
      map: texture,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      vertexColors: true,
      opacity: 0.9,
      transparent: true
    });

    const heartParticles = new THREE.Points(geometry, material);
    const heartGroup = new THREE.Group();
    heartGroup.add(heartParticles);
    scene.add(heartGroup);

    // ---------- 底部呼吸更新 ----------
    const maxSpread = 0.6; // 扩散幅度
    function updateBreath(amp) {
      const posArr = geometry.attributes.position.array;
      for (let i = 0; i < basePos.length; i++) {
        const b = basePos[i];
        const w = bottomWeights[i];
        const len = Math.sqrt(b.x*b.x + b.y*b.y) + 0.001;
        const nx = b.x / len;
        const ny = b.y / len;
        const offset = amp * w * maxSpread;
        posArr[i*3]   = b.x + nx * offset;
        posArr[i*3+1] = b.y + ny * offset;
        posArr[i*3+2] = b.z;
      }
      geometry.attributes.position.needsUpdate = true;
    }

    // ---------- 背景星光 ----------
    const starsGeo = new THREE.BufferGeometry();
    const starsPos = new Float32Array(400*3);
    for (let i=0; i<400*3; i+=3) {
      const r = 6 + Math.random()*15;
      const th = Math.random()*Math.PI*2;
      const ph = Math.asin((Math.random()*2)-1);
      starsPos[i]   = Math.cos(th)*Math.cos(ph)*r;
      starsPos[i+1] = Math.sin(ph)*r*0.6;
      starsPos[i+2] = Math.sin(th)*Math.cos(ph)*r;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const starsMat = new THREE.PointsMaterial({size:0.06, color:0xaaccff, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.5, transparent:true});
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // ---------- 动画 ----------
    function animate(time) {
      requestAnimationFrame(animate);
      const t = time * 0.001;
      // 整体爱心绕Y轴旋转
      heartGroup.rotation.y = t * 0.6;
      // 呼吸幅度：使用正弦波，0~1之间变化，周期约2.5秒
      const breath = (Math.sin(t * 2.5) + 1) / 2;
      updateBreath(breath);
      stars.rotation.y += 0.0002;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

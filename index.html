<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>给你看个东西</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b1a; /* 兜底深色背景 */
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #0b0b1a 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block; /* 确保显示 */
    }

    .text-container {
      position: fixed;
      z-index: 20;
      text-align: center;
      color: #fff;
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }

    .text-container.visible {
      opacity: 1;
    }

    .main-line {
      font-size: 2.6rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-shadow: 0 0 30px rgba(255, 200, 220, 0.7);
      animation: softPulse 2.8s ease-in-out infinite;
      font-family: "STKaiti", "KaiTi", "楷体", "PingFang SC", serif;
    }

    .sub-line {
      font-size: 1.4rem;
      font-weight: 300;
      opacity: 0;
      animation: fadeSlideUp 1.6s ease forwards;
      animation-delay: 1.3s;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 12px rgba(255, 180, 200, 0.5);
    }

    .hint-line {
      font-size: 0.95rem;
      margin-top: 2rem;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 3.2s;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.1em;
    }

    @keyframes softPulse {
      0%, 100% {
        text-shadow: 0 0 30px rgba(255, 180, 200, 0.7);
      }
      50% {
        text-shadow: 0 0 60px rgba(255, 160, 180, 0.9), 0 0 100px rgba(200, 120, 160, 0.4);
      }
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <div class="text-container" id="textContainer">
    <div class="main-line">我喜欢你</div>
    <div class="sub-line">像星光落入你眼里</div>
    <div class="hint-line">不用急着回复，只是想让你知道。</div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      const textContainer = document.getElementById('textContainer');

      let width, height;
      const particles = [];
      const PARTICLE_COUNT = 200; // 降低数量提高性能
      const heartScale = Math.min(window.innerWidth, window.innerHeight) * 0.018; // 动态尺寸
      let phase = 'scatter';
      let transitionProgress = 0;
      let showTextTimer = null;
      let animationId = null;

      function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
      function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); }

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.baseX = this.x;
          this.baseY = this.y;
          const t = Math.random() * Math.PI * 2;
          this.targetX = width / 2 + heartX(t) * heartScale;
          this.targetY = height / 2 - heartY(t) * heartScale * 0.65;
          this.size = Math.random() * 2.2 + 0.8;
          this.alpha = Math.random() * 0.6 + 0.4;
          this.color = `hsla(${Math.random() * 30 + 330}, 80%, 75%, ${this.alpha})`;
        }

        update(progress) {
          const eased = 1 - Math.pow(1 - progress, 3);
          this.x = this.baseX + (this.targetX - this.baseX) * eased;
          this.y = this.baseY + (this.targetY - this.baseY) * eased;
          if (phase === 'heart') {
            this.x += Math.sin(Date.now() * 0.002 + this.targetX * 0.05) * 1.2;
            this.y += Math.cos(Date.now() * 0.0018 + this.targetY * 0.05) * 1.2;
          }
        }

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = this.color;
          ctx.shadowColor = 'rgba(255, 180, 200, 0.9)';
          ctx.shadowBlur = this.size * 4;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function initParticles() {
        particles.length = 0;
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        const newScale = Math.min(width, height) * 0.018;
        particles.forEach(p => {
          p.baseX = Math.random() * width;
          p.baseY = Math.random() * height;
          const t = Math.random() * Math.PI * 2;
          p.targetX = width / 2 + heartX(t) * newScale;
          p.targetY = height / 2 - heartY(t) * newScale * 0.65;
        });
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        if (phase === 'gathering') {
          transitionProgress += 0.008;
          if (transitionProgress >= 1) {
            transitionProgress = 1;
            phase = 'heart';
            if (showTextTimer) clearTimeout(showTextTimer);
            showTextTimer = setTimeout(() => textContainer.classList.add('visible'), 400);
          }
        }
        particles.forEach(p => {
          if (phase === 'scatter') {
            p.x = p.baseX + Math.sin(Date.now() * 0.001 + p.y * 0.03) * 0.8;
            p.y = p.baseY + Math.cos(Date.now() * 0.0012 + p.x * 0.03) * 0.8;
          } else {
            p.update(transitionProgress);
          }
          p.draw(ctx);
        });
        animationId = requestAnimationFrame(animate);
      }

      function startGathering() {
        if (phase === 'scatter') {
          phase = 'gathering';
          transitionProgress = 0;
        }
      }

      // 紧急兜底：如果Canvas完全没反应，3秒后强制显示文字
      const fallbackTimer = setTimeout(() => {
        if (phase === 'scatter') {
          startGathering();
        }
        textContainer.classList.add('visible');
      }, 5000);

      window.addEventListener('load', () => {
        resize();
        initParticles();
        animate();
        setTimeout(startGathering, 3000);
      });

      window.addEventListener('resize', resize);
      document.body.addEventListener('click', startGathering);
    })();
  </script>
</body>
</html>

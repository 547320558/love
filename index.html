<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>双冰晶爱心 · 3D呼吸旋转</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #020b18;
      background: radial-gradient(ellipse at center, #0a1a3a 0%, #020b18 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="dualHeartCanvas"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('dualHeartCanvas');
      const ctx = canvas.getContext('2d');

      let width, height, centerX, centerY;
      let heart1Center, heart2Center;
      const heart1Particles = [];
      const heart2Particles = [];
      const focalLength = 500;
      let angleY = 0;
      const rotateSpeed = 0.01;

      // 爱心2渐显
      let heart2Opacity = 0;
      let showHeart2 = false;
      const HEART2_DELAY = 2.0;
      let startTime = null;

      // 爱心方程
      function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
      function heartY(t) {
        return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      }

      function createHeartParticles(hueRange, sat, lightRange, alphaRange, sizeRange, scaleH, zRange) {
        const arr = [];
        const CONTOUR = 200;
        const INNER = 70;
        const step = (Math.PI * 2) / CONTOUR;

        // 轮廓
        for (let i = 0; i < CONTOUR; i++) {
          const t = i * step;
          let hx = heartX(t);
          let hy = heartY(t);
          hx += (Math.random() - 0.5) * 0.6;
          hy += (Math.random() - 0.5) * 0.6;
          const z = (Math.random() - 0.5) * zRange;
          // 随机漂移向量（单位大小，后续乘系数）
          const angle = Math.random() * Math.PI * 2;
          const driftMag = (0.1 + Math.random() * 0.3) * scaleH;
          arr.push({
            localX: hx * scaleH,
            localY: hy * scaleH,
            localZ: z,
            driftX: Math.cos(angle) * driftMag,
            driftY: Math.sin(angle) * driftMag,
            driftZ: (Math.random() - 0.5) * zRange * 0.5,
            hue: hueRange[0] + Math.random() * (hueRange[1] - hueRange[0]),
            sat,
            light: lightRange[0] + Math.random() * (lightRange[1] - lightRange[0]),
            alphaBase: alphaRange[0] + Math.random() * (alphaRange[1] - alphaRange[0]),
            size: sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]),
            twinkleSpeed: Math.random() * 0.03 + 0.01,
            twinkleOffset: Math.random() * Math.PI * 2
          });
        }

        // 内部填充
        for (let i = 0; i < INNER; i++) {
          const t = Math.random() * Math.PI * 2;
          const factor = Math.random() * 0.7;
          let hx = heartX(t) * factor;
          let hy = heartY(t) * factor;
          hx += (Math.random() - 0.5) * 0.5;
          hy += (Math.random() - 0.5) * 0.5;
          const z = (Math.random() - 0.5) * zRange;
          const angle = Math.random() * Math.PI * 2;
          const driftMag = (0.1 + Math.random() * 0.3) * scaleH;
          arr.push({
            localX: hx * scaleH,
            localY: hy * scaleH,
            localZ: z,
            driftX: Math.cos(angle) * driftMag,
            driftY: Math.sin(angle) * driftMag,
            driftZ: (Math.random() - 0.5) * zRange * 0.5,
            hue: hueRange[0] + Math.random() * (hueRange[1] - hueRange[0]),
            sat,
            light: lightRange[0] + Math.random() * (lightRange[1] - lightRange[0]),
            alphaBase: alphaRange[0] + Math.random() * (alphaRange[1] - alphaRange[0]),
            size: sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]),
            twinkleSpeed: Math.random() * 0.03 + 0.01,
            twinkleOffset: Math.random() * Math.PI * 2
          });
        }
        return arr;
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;

        const targetHeartWidth = width * 0.42;  // 再稍微大一点
        const scaleH = targetHeartWidth / 32;
        const zRange = scaleH * 0.25;
        const offsetX = width * 0.26;

        heart1Center = { x: centerX - offsetX, y: centerY };
        heart2Center = { x: centerX + offsetX, y: centerY };

        heart1Particles.length = 0;
        heart2Particles.length = 0;

        const raw1 = createHeartParticles([195, 215], 85, [70, 90], [0.5, 0.9], [1.0, 2.5], scaleH, zRange);
        heart1Particles.push(...raw1);

        const raw2 = createHeartParticles([30, 48], 80, [70, 95], [0.5, 0.9], [0.9, 2.3], scaleH, zRange);
        heart2Particles.push(...raw2);
      }

      function drawParticle(ctx, time, p, worldCenter, alphaMultiplier, dispersion) {
        // 旋转
        const cos = Math.cos(angleY);
        const sin = Math.sin(angleY);
        let xRot = p.localX * cos - p.localZ * sin;
        let zRot = p.localX * sin + p.localZ * cos;
        let yRot = p.localY;

        // 呼吸缩放 + 漂移
        const breathScale = 1 + dispersion * 0.35;          // 整体缩放
        const driftFactor = dispersion * 0.8;               // 漂移力度

        xRot = xRot * breathScale + p.driftX * driftFactor;
        yRot = yRot * breathScale + p.driftY * driftFactor;
        zRot = zRot * breathScale + p.driftZ * driftFactor;

        // 世界坐标
        const worldX = worldCenter.x + xRot;
        const worldY = worldCenter.y + yRot;
        const worldZ = zRot;

        // 投影
        const scale = focalLength / (focalLength + worldZ);
        if (scale < 0.1) return;
        const sx = centerX + (worldX - centerX) * scale;
        const sy = centerY + (worldY - centerY) * scale;

        const alpha = p.alphaBase * (0.75 + 0.25 * Math.sin(time * p.twinkleSpeed + p.twinkleOffset)) * alphaMultiplier;
        const size = Math.max(0.2, p.size * scale);

        // 冰晶光晕
        const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, size * 2.2);
        glow.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`);
        glow.addColorStop(0.6, `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha * 0.3})`);
        glow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(sx, sy, size * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // 核心亮点
        ctx.beginPath();
        ctx.arc(sx, sy, size * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.95})`;
        ctx.fill();

        // 星芒
        if (p.size > 1.2 && Math.random() < 0.12) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
          ctx.lineWidth = 0.4;
          ctx.beginPath();
          ctx.moveTo(sx - size * 2, sy);
          ctx.lineTo(sx + size * 2, sy);
          ctx.moveTo(sx, sy - size * 2);
          ctx.lineTo(sx, sy + size * 2);
          ctx.stroke();
        }
      }

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const time = timestamp / 1000;
        ctx.clearRect(0, 0, width, height);

        // 极浅星尘背景
        for (let i = 0; i < 3; i++) {
          const sx = Math.random() * width;
          const sy = Math.random() * height;
          ctx.fillStyle = `rgba(200,230,255,${Math.random() * 0.15})`;
          ctx.beginPath();
          ctx.arc(sx, sy, Math.random() * 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        // 爱心2渐显
        if (time >= HEART2_DELAY && !showHeart2) {
          showHeart2 = true;
        }
        if (showHeart2) {
          heart2Opacity = Math.min(1, heart2Opacity + 0.02);
        }

        angleY += rotateSpeed;

        // 呼吸扩散因子（两个爱心交替）
        const breathSpeed = 1.8;
        const raw1 = Math.sin(time * breathSpeed) * 0.5 + 0.5;          // 0~1
        const raw2 = Math.sin(time * breathSpeed + Math.PI) * 0.5 + 0.5; // 相位差 π，交替

        // 绘制爱心1
        heart1Particles.forEach(p => drawParticle(ctx, time, p, heart1Center, 1.0, raw1));

        // 绘制爱心2
        if (showHeart2 || heart2Opacity > 0) {
          heart2Particles.forEach(p => drawParticle(ctx, time, p, heart2Center, heart2Opacity, raw2));
        }

        requestAnimationFrame(animate);
      }

      window.addEventListener('load', () => {
        resize();
        requestAnimationFrame(animate);
        document.body.addEventListener('touchstart', () => {}, { passive: true });
      });
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>给你看个东西</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #0b0b1a 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .text-container {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #fff;
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }

    .text-container.visible {
      opacity: 1;
    }

    .main-line {
      font-size: 2.6rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-shadow: 0 0 30px rgba(255, 200, 220, 0.7);
      animation: softPulse 2.8s ease-in-out infinite;
      font-family: "STKaiti", "KaiTi", "楷体", "PingFang SC", serif;
    }

    .sub-line {
      font-size: 1.4rem;
      font-weight: 300;
      opacity: 0;
      animation: fadeSlideUp 1.6s ease forwards;
      animation-delay: 1.3s;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 12px rgba(255, 180, 200, 0.5);
    }

    .hint-line {
      font-size: 0.95rem;
      margin-top: 2rem;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 3.2s;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.1em;
    }

    @keyframes softPulse {
      0%, 100% {
        text-shadow: 0 0 30px rgba(255, 180, 200, 0.7);
      }
      50% {
        text-shadow: 0 0 60px rgba(255, 160, 180, 0.9), 0 0 100px rgba(200, 120, 160, 0.4);
      }
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <div class="text-container" id="textContainer">
    <div class="main-line">我喜欢你</div>
    <div class="sub-line">像星光落入你眼里</div>
    <div class="hint-line">不用急着回复，只是想让你知道。</div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');
      const textContainer = document.getElementById('textContainer');

      let width, height;
      const particles = [];
      const PARTICLE_COUNT = 280;
      const heartScale = 15;  // 心形大小系数
      let phase = 'scatter';  // scatter / gathering / heart
      let transitionProgress = 0; // 0->1 表示聚集进度
      let showTextTimer = null;

      // 心形参数方程：x = 16 sin^3(t), y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
      function heartX(t) {
        return 16 * Math.pow(Math.sin(t), 3);
      }

      function heartY(t) {
        return 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      }

      // 粒子类
      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          // 初始随机散布在全屏幕
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.baseX = this.x;
          this.baseY = this.y;
          // 目标心形位置 (相对画布中心的偏移)
          const t = Math.random() * Math.PI * 2;
          const hx = heartX(t);
          const hy = heartY(t);
          this.targetX = width / 2 + hx * heartScale;
          // 翻转 Y 使心尖朝下
          this.targetY = height / 2 - hy * heartScale * 0.65;

          this.size = Math.random() * 2.2 + 0.8;
          this.alpha = Math.random() * 0.6 + 0.4;
          this.color = `hsla(${Math.random() * 30 + 330}, 80%, 75%, ${this.alpha})`; // 粉紫调
          this.speedFactor = Math.random() * 0.5 + 0.4;
        }

        update(progress) {
          // 使用缓动让粒子先快后慢地聚集
          const eased = easeOutCubic(progress);
          this.x = this.baseX + (this.targetX - this.baseX) * eased;
          this.y = this.baseY + (this.targetY - this.baseY) * eased;

          // 到达目标后微微浮动
          if (phase === 'heart') {
            const floatX = (Math.sin(Date.now() * 0.002 + this.targetX * 0.05) * 1.2);
            const floatY = (Math.cos(Date.now() * 0.0018 + this.targetY * 0.05) * 1.2);
            this.x += floatX;
            this.y += floatY;
          }
        }

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = this.color;
          ctx.shadowColor = 'rgba(255, 180, 200, 0.9)';
          ctx.shadowBlur = this.size * 4;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function initParticles() {
        particles.length = 0;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        // 重新设置散布位置
        particles.forEach(p => {
          p.baseX = Math.random() * width;
          p.baseY = Math.random() * height;
          const t = Math.random() * Math.PI * 2;
          p.targetX = width / 2 + heartX(t) * heartScale;
          p.targetY = height / 2 - heartY(t) * heartScale * 0.65;
        });
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        // 更新过渡
        if (phase === 'gathering') {
          transitionProgress += 0.008;
          if (transitionProgress >= 1) {
            transitionProgress = 1;
            phase = 'heart';
            // 心形稳定后显示文字
            if (showTextTimer) clearTimeout(showTextTimer);
            showTextTimer = setTimeout(() => {
              textContainer.classList.add('visible');
            }, 400);
          }
        }

        // 绘制粒子
        particles.forEach(p => {
          if (phase === 'scatter') {如果 (阶段 === '散射') {
            // 初始散乱状态，粒子轻微飘动
            p.x = p.baseX + Math.sin(Date.now() * 0.001 + p.y * 0.03) * 0.8;
            p.y = p.baseY + Math.cos(Date.now() * 0.0012 + p.x * 0.03) * 0.8;
          } else if (phase === 'gathering' || phase === 'heart') {
            p.update(transitionProgress);
          }
          p.draw(ctx);
        });

        requestAnimationFrame(animate);
      }

      // 启动：先散乱3秒，然后开始聚集
      function startGathering() {
        phase = 'gathering';
        transitionProgress = 0;
      }

      window.addEventListener('load', () => {
        resize();调整大小();
        initParticles();初始化粒子();
        animate();动画();

        // 3秒后粒子开始汇聚成心形
        setTimeout(startGathering, 3000);
      });

      window.addEventListener('resize', () => {
        resize();调整大小();
      });

      // 移动端点击或触摸也可以触发？（可选加速显示）
      document.body.addEventListener('click', () => {
        if (phase === 'scatter') {如果 (阶段 === '散射') {
          startGathering();开始收集();
        }
      });

    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>粉色粒子包裹爱心 | 立体外壳</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.126.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ---------- 场景 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d1a);
    scene.fog = new THREE.FogExp2(0x0d0d1a, 0.00001);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.5, 7);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x0d0d1a);
    document.body.appendChild(renderer.demElement);

    // 灯光
    scene.add(new THREE.AmbientLight(0x331122, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffaacc, 0.9);
    dirLight.position.set(1, 1, 1);
    scene.add(dirLight);

    // 背景星点
    const starsGeo = new THREE.BufferGeometry();
    const starsPos = new Float32Array(400 * 3);
    for (let i = 0; i < 400 * 3; i += 3) {
      const r = 6 + Math.random() * 18;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.asin((Math.random() * 2) - 1);
      starsPos[i]     = Math.cos(theta) * Math.cos(phi) * r;
      starsPos[i + 1] = Math.sin(phi) * r * 0.6;
      starsPos[i + 2] = Math.sin(theta) * Math.cos(phi) * r;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const starsMat = new THREE.PointsMaterial({
      size: 0.08,
      color: 0xff99cc,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.5,
      transparent: true
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    scene.add(stars);

    // ---------- 心形参数方程 ----------
    function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
    function heartY(t) {
      return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    }

    // ---------- 生成包裹粒子：表面采样 + Z轴厚度 ----------
    const scale = 0.09;
    const surfaceSamples = 4000;   // 总粒子数（足够密集）
    const positions = new Float32Array(surfaceSamples * 3);
    const colors = new Float32Array(surfaceSamples * 3);

    // 粉色渐变定义
    const colorLight = new THREE.Color('#ffb6c1'); // 浅粉
    const colorBase = new THREE.Color('#ff69b4');  // 热粉
    const colorDeep = new THREE.Color('#c71585');  // 深粉

    for (let i = 0; i < surfaceSamples; i++) {
      // 随机角度，覆盖整个轮廓
      const t = Math.random() * Math.PI * 2;

      // 轮廓因子：大部分粒子在1.0附近（外壳），少量在0.9~1.0之间微调
      let factor;
      if (Math.random() < 0.8) {
        factor = 0.98 + Math.random() * 0.04; // 紧贴表面
      } else {
        factor = 0.9 + Math.random() * 0.1;   // 稍微内外浮动
      }

      let hx = heartX(t) * factor * scale;
      let hy = heartY(t) * factor * scale;

      // Z轴厚度：较大的范围，体现立体包裹
      // 根据心形曲线，侧面也会有粒子，所以使用随机偏移
      const zDepth = (Math.random() - 0.5) * 2.5 * scale * 12; 
      // 对于边缘点，Z轴可以更大胆一点，形成厚度感
      const edgeDist = Math.sqrt(hx*hx + hy*hy);
      const zOffset = (Math.random() - 0.5) * 0.25 * edgeDist * 0.7;
      
      positions[i * 3]     = hx;
      positions[i * 3 + 1] = hy;
      positions[i * 3 + 2] = zDepth + zOffset;

      // 颜色：根据离中心距离渐变（越边缘越亮）
      const distRatio = Math.min(1, edgeDist / (17.5 * scale));
      const mixedColor = colorBase.clone().lerp(colorLight, distRatio * 0.7);
      // 再加一点随机变化
      mixedColor.lerp(colorDeep, Math.random() * 0.2);
      
      colors[i * 3]     = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    // 创建几何体并设置属性
    const heartGeo = new THREE.BufferGeometry();
    heartGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // 圆形发光粒子纹理
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.arc(16, 16, 14, 0, 2 * Math.PI);
    const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.3, 'rgba(255,200,220,1)');
    gradient.addColorStop(0.7, 'rgba(255,105,180,0.7)');
    gradient.addColorStop(1, 'rgba(255,20,147,0)');
    ctx.fillStyle = gradient;
    ctx.fill();
    const particleTexture = new THREE.CanvasTexture(canvas);

    const heartMat = new THREE.PointsMaterial({
      size: 0.18,
      map: particleTexture,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      vertexColors: true,
      opacity: 0.9,
      transparent: true
    });

    const heartPoints = new THREE.Points(heartGeo, heartMat);
    const heartGroup = new THREE.Group();
    heartGroup.add(heartPoints);
    scene.add(heartGroup);

    // ---------- 动画 ----------
    function animate() {
      const time = performance.now() * 0.001;
      // 旋转展示立体感
      heartGroup.rotation.y = time * 0.7;
      heartGroup.rotation.x = Math.sin(time * 0.4) * 0.1; // 轻微上下摆动，增加动感
      stars.rotation.y += 0.0002;
      stars.rotation.x += 0.0001;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
